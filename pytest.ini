[pytest]
# importlib import mode avoids a real collision: tests/agent/ (a test
# subpackage) and agent/ (the Phase 2 package under test) share the
# basename "agent". Default "prepend" mode resolves `import agent` to
# whichever one pytest's rootdir walk finds first, which silently breaks
# `from agent.tools... import ...` inside tests/agent/*.py. Confirmed by
# reproducing the ModuleNotFoundError under prepend mode before adding
# this file.
addopts = --import-mode=importlib
