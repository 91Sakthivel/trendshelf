name: Weekly Price Collection

on:
  schedule:
    # Wednesdays 14:00 UTC (~9am Central). Adjust if you want a different hour.
    - cron: '0 14 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plumbing test only — no API calls, no writes'
        type: boolean
        default: true        # SAFE DEFAULT: manual runs are dry unless you opt in
      force:
        description: 'Override skip-if-exists (collect even if today already ran)'
        type: boolean
        default: false

# Prevent overlapping runs; do NOT auto-retry (protects SerpAPI 250/mo quota)
concurrency:
  group: weekly-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # hard ceiling; collection is ~15 min
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install collector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-collector.txt

      - name: Write GCP service account key to file
        run: |
          set -euo pipefail
          echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > credentials.json
          # Verify it decoded to valid JSON with a private_key, else abort BEFORE collection
          python -c "import json,sys; d=json.load(open('credentials.json')); assert d.get('private_key') and d.get('client_email'), 'SA key missing fields'; print('SA key OK:', d['client_email'])"

      - name: Run weekly price collection
        env:
          GCP_CREDENTIALS_PATH: credentials.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          DRY=""
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && DRY="--dry-run"
            [ "${{ inputs.force }}" = "true" ] && FORCE="--force"
          fi
          echo "Running: collect_apis.py --mode prices $DRY $FORCE  (event=${{ github.event_name }})"
          python collect_apis.py --mode prices $DRY $FORCE

      - name: Verify today's partition landed
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        env:
          GCP_CREDENTIALS_PATH: credentials.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python -c "
          import os
          from google.cloud import bigquery
          from google.oauth2 import service_account
          from datetime import date

          creds_path = os.environ['GCP_CREDENTIALS_PATH']
          project    = os.environ['GCP_PROJECT_ID']
          creds = service_account.Credentials.from_service_account_file(
              creds_path,
              scopes=['https://www.googleapis.com/auth/bigquery'],
          )
          bq = bigquery.Client(project=project, credentials=creds)

          today = date.today().isoformat()
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')

          for tbl, floor in [('kroger_prices_raw', 8000), ('serpapi_prices_raw', 200)]:
              q = f\"SELECT COUNT(*) c FROM {project}.bronze.{tbl} WHERE DATE(collected_at) = '{today}'\"
              n = list(bq.query(q).result())[0].c
              print(f'{tbl} {today}: {n} rows (floor {floor})')
              assert n >= floor, f'{tbl} thin/missing partition for {today}: {n} < {floor}'

          # ── Coverage checks ────────────────────────────────────────────────────
          # A total row-count floor alone can pass while several categories/stores are
          # silently missing entirely (surviving ones make up the volume). These check
          # DISTINCT coverage instead.

          # SerpAPI: schedule-only. collect_serpapi() has a 6-day per-category cache, so
          # an off-cadence manual run correctly sees fewer than 10 categories as 'stale'
          # and legitimately writes fewer categories today -- not a failure. This already
          # happened once (2026-07-16 manual run collided with the cache). The weekly
          # schedule always lands >= 6 days after the prior run, so every category is
          # always stale then -- this check only means something on that cadence.
          if event_name == 'schedule':
              q = f\"SELECT COUNT(DISTINCT category) c FROM {project}.bronze.serpapi_prices_raw WHERE DATE(collected_at) = '{today}'\"
              n_cat = list(bq.query(q).result())[0].c
              print(f'serpapi_prices_raw {today}: {n_cat}/10 categories covered (floor 8)')
              assert n_cat >= 8, f'serpapi_prices_raw only covered {n_cat}/10 categories for {today}'
          else:
              print(f'serpapi_prices_raw category-coverage check skipped (event={event_name!r} -- SerpAPI\'s 6-day cache can legitimately thin category coverage off-cadence)')

          # Kroger: NOT gated. collect_kroger_prices() has no per-store cache -- every run
          # that actually collects (i.e. isn't skipped whole-run by _partition_exists_today())
          # always attempts all 20 stores, so a thin store count is always a real signal,
          # schedule or manual, unlike SerpAPI's category check above. Floor tolerates a
          # store or two failing (transient per-store catalog gaps) without crying wolf,
          # but not more.
          q = f\"SELECT COUNT(DISTINCT store_id) c FROM {project}.bronze.kroger_prices_raw WHERE DATE(collected_at) = '{today}'\"
          n_store = list(bq.query(q).result())[0].c
          print(f'kroger_prices_raw {today}: {n_store}/20 stores covered (floor 18)')
          assert n_store >= 18, f'kroger_prices_raw only covered {n_store}/20 stores for {today}'

          print('Both partitions verified for', today)
          "

      - name: Remove credential file
        if: always()           # delete the key even if an earlier step failed
        run: rm -f credentials.json

  transform:
    needs: collect
    if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dbt
        run: pip install dbt-bigquery==1.9.0 dbt-core==1.9.0

      - name: Write GCP service account key to file
        run: |
          set -euo pipefail
          echo "${{ secrets.GCP_SA_KEY }}" | base64 -d > credentials.json
          python -c "import json,sys; d=json.load(open('credentials.json')); assert d.get('private_key') and d.get('client_email'), 'SA key missing fields'; print('SA key OK:', d['client_email'])"

      - name: Write dbt profiles.yml
        run: |
          cat > "$GITHUB_WORKSPACE/profiles.yml" <<'EOF'
          trendshelf:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: "{{ env_var('GCP_PROJECT_ID') }}"
                dataset: "{{ env_var('GCP_DATASET', 'bronze') }}"
                keyfile: "{{ env_var('GCP_CREDENTIALS_PATH', 'credentials.json') }}"
                threads: 4
                timeout_seconds: 300
          EOF

      - name: Install dbt packages
        env:
          GCP_CREDENTIALS_PATH: credentials.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          dbt deps --profiles-dir "$GITHUB_WORKSPACE"

      - name: dbt run
        env:
          GCP_CREDENTIALS_PATH: credentials.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          dbt run --profiles-dir "$GITHUB_WORKSPACE"

      - name: dbt test
        env:
          GCP_CREDENTIALS_PATH: credentials.json
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          dbt test --profiles-dir "$GITHUB_WORKSPACE"

      - name: Remove credential file
        if: always()
        run: rm -f credentials.json
