name: trendshelf
version: "1.0.0"
config-version: 2

profile: trendshelf

model-paths:    ["models"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # ── Opportunity score weights (must sum to 1.0) ──────────────────────────────
  # Adjust when more historical data accumulates
  opp_weight_demand:     0.25
  opp_weight_expansion:  0.20
  opp_weight_pricing:    0.20
  opp_weight_confidence: 0.15
  opp_weight_risk:       0.10
  opp_weight_margin:     0.10

  # ── Opportunity tier thresholds ───────────────────────────────────────────────
  opp_tier_prime:  75
  opp_tier_solid:  55
  opp_tier_watch:  35

  # ── Demand signal thresholds ──────────────────────────────────────────────────
  demand_high_threshold:   65
  demand_medium_threshold: 45

  # ── Confidence tier thresholds ────────────────────────────────────────────────
  confidence_high:   75
  confidence_medium: 50

  # ── Action cascade thresholds ─────────────────────────────────────────────────
  investigate_confidence_threshold:  45
  avoid_margin_pressure_threshold:   80
  avoid_markdown_safety_threshold:   40
  expand_readiness_threshold:        80
  expand_confidence_threshold:       70
  expand_margin_threshold:           70
  # A genuine margin squeeze at/above this blocks an expansion recommendation (PITCH NOW /
  # PREPARE PITCH / MONITOR AND PREPARE) — same threshold as the FIX MARGINS gate itself, so
  # a real squeeze can never be silently dropped by a higher-priority readiness/risk gate.
  # See docs/threshold_decisions.md #7.11.
  expansion_margin_fix_threshold:    70
  # Action routing gates — externalized for reproducibility; tunable as data accumulates
  margin_pressure_avoid_threshold:   65    # Raise Price: block if margin pressure exceeds this
  pricing_power_hold_threshold:      70    # Hold Premium: minimum pricing power score required
  pricing_power_strong_threshold:    75    # Hold Premium: bypass relevance check at this power level
  reduce_price_min_gap_pct:          10    # Reduce Price: minimum adjusted gap (%) to act
  markdown_safety_full_threshold:    60    # Full cut if >= this; Partial cut if [avoid_markdown_safety, this)
  competitive_threat_threshold:      70    # Protect Price: block if competitive threat exceeds this

  # ── Pricing band calibration (v4 — tuning constants, sensitivity-tested) ──────
  # Empirically derived thresholds once 6+ months of collection accumulates.
  cv_multiplier:                     0.16
  min_price_gap_threshold:            8.0
  max_price_gap_threshold:           25.0
  # reliability gate
  reliability_low_gap_threshold:     50.0
  reliability_medium_gap_threshold:  25.0
  reliability_min_competitor_count:  10
  max_competitor_staleness_days:     14
  max_ppi_staleness_months:           4    # PPI change treated as unknown beyond this many months stale (FRED's documented normal reporting lag is ~2 months; see fact_market_signals.sql header)
  # ── FRED series-awareness ─────────────────────────────────────────────────────
  # Single point of truth for which FRED series scoring uses. stg_fred_ppi filters to
  # exactly this series; every downstream model assumes a single-series time series.
  scoring_ppi_series_id: 'PCU311311'
  # Minimum monthly rows stg_fred_ppi must have. int_macro_trend_features.sql's
  # ppi_yoy_value = LAG(ppi_value, 12) needs 13 rows for even the most recent month to
  # produce a non-null year-over-year comparison; below 13 that feature is unconditionally
  # NULL for every row - a silent truncation, not an explicit failure.
  min_ppi_monthly_rows:               13
  # Month-over-month PPI % moves at or below this are treated as flat, not "rising", in
  # mart_price_margin_scores.sql's margin_pressure_proxy_score branch tests. Derived from
  # PCU311311's own historical distribution (17 months): a 6x gap sits between the two
  # smallest observed moves (0.0248%, 0.0333%) and the next (0.2002%); 0.1 sits centered in
  # that gap. See docs/threshold_decisions.md #7.8.
  ppi_deadband_pct:                   0.1
  # confidence smoothing (Laplace-style shrinkage toward zero)
  confidence_smoothing_k:            15.0
  # demand slope state (t-stat-like ratio threshold)
  demand_slope_rising_threshold:      0.3
  # directional signal promotion threshold (collections needed to graduate from Provisional → Established)
  directional_established_min_dates:  4
  threshold_config_version:         'v4_cv_calibrated'

models:
  trendshelf:
    staging:
      +materialized: view
      +schema: bronze
    intermediate:
      +materialized: table
      +schema: bronze
    marts:
      +materialized: table
      +schema: bronze
